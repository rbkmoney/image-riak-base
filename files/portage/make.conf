# -std=gnu17: erlang-22.3.4.21 driver code uses false/true as identifiers,
# which gcc-15's default C23 rejects; ebuild-level append-cflags does not
# reach the erts emulator build, so there's a quick and dirty hack. Remove
# when Riak's erlang updates.
CFLAGS="-march=corei7-avx -mtune=corei7-avx -O2 -pipe -std=gnu17 -mfpmath=sse -mno-fma -mno-fma4 -mno-avx2 -mno-xop"
CXXFLAGS="${CFLAGS}"
CHOST="x86_64-pc-linux-gnu"

MAKEOPTS="-j4"

FEATURES="sandbox userfetch parallel-fetch parallel-install clean-logs unmerge-orphans
	splitdebug compressdebug
	getbinpkg
	-xattr -news nodoc noinfo noman"
EMERGE_DEFAULT_OPTS="--quiet-build --verbose"

GENTOO_MIRRORS="https://gentoo.bakka.su/gentoo-distfiles https://mirrors.aliyun.com/gentoo"
PORTAGE_BINHOST="https://gentoo.bakka.su/gentoo-packages/amd64/corei7-avx/packages"

ACCEPT_KEYWORDS="amd64"
L10N="en"
CPU_FLAGS_X86="mmx mmxext sse sse2 sse3 ssse3 sse4 sse4_1 sse4_2 aes avx"
USE="smp sctp ssl openssl lzma cacert -static-libs -acl -xattr -gnutls -tcpd -nls -doc -examples"
